open:
  name: Open
  description: >
    Open a fullscreen webrtc-babycam overlay on every connected browser.
    All fields are forwarded verbatim to the card as its configuration.
  fields:
    entity:
      name: Entity
      description: HA camera entity — identity, snapshots, and (unless stream is set) what plays.
      required: true
      example: camera.doorbell
      selector:
        text:
    stream:
      name: Stream
      description: go2rtc stream to play instead of the entity (e.g. a lighter transcode).
      example: camera.doorbell_hd
      selector:
        text:
    image_entity:
      name: Image entity
      description: Entity supplying still snapshots (poster) instead of the camera entity.
      example: camera.doorbell
      selector:
        entity:
          domain:
            - camera
            - image
    url:
      name: URL
      description: >
        Signaling URL for a non-default direct url_type. Not used by the
        integration-backed webrtc-babycam transport.
      selector:
        text:

close:
  name: Close
  description: Close the fullscreen webrtc-babycam overlay on every connected browser.
